name: ChatGPT Retro Hardware Assets

on:
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/chatgpt_fetch_retro_hardware.yml'

permissions:
  contents: read

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch authentic hardware images from Wikimedia
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          from pathlib import Path

          SYSTEMS = {
            '1970s': [
              ('1976_channelf', 'Fairchild Channel F'),
              ('1977_atari2600', 'Atari 2600'),
              ('1977_commodore_pet', 'Commodore PET'),
              ('1978_odyssey2', 'Magnavox Odyssey 2'),
              ('1979_intellivision', 'Intellivision'),
            ],
            '1980s': [
              ('1980_vic20', 'VIC-20'),
              ('1980_p2000t', 'Philips P2000'),
              ('1980_game_watch', 'Game & Watch'),
              ('1981_zx81', 'ZX81'),
              ('1981_pc8801', 'PC-8800 series'),
              ('1981_ibm_pc', 'IBM Personal Computer'),
              ('1982_atari5200', 'Atari 5200'),
              ('1982_colecovision', 'ColecoVision'),
              ('1982_c64', 'Commodore 64'),
              ('1982_vectrex', 'Vectrex'),
              ('1982_zxspectrum', 'ZX Spectrum'),
              ('1982_sharp_x1', 'Sharp X1'),
              ('1983_sg1000', 'SG-1000'),
              ('1983_nes', 'Nintendo Entertainment System'),
              ('1983_msx', 'MSX'),
              ('1984_amstrad_cpc', 'Amstrad CPC'),
              ('1984_plus4', 'Commodore Plus/4'),
              ('1985_c128', 'Commodore 128'),
              ('1985_amiga', 'Amiga 1000'),
              ('1985_msx2', 'MSX2'),
              ('1985_master_system', 'Master System'),
              ('1986_atari7800', 'Atari 7800'),
              ('1987_pc_engine', 'PC Engine'),
              ('1988_genesis', 'Sega Genesis'),
              ('1988_pc_engine_cd', 'PC Engine CD-ROM²'),
              ('1989_game_boy', 'Game Boy'),
              ('1989_atari_lynx', 'Atari Lynx'),
            ],
            '1990s': [
              ('1990_snes', 'Super Nintendo Entertainment System'),
              ('1990_game_gear', 'Game Gear'),
              ('1991_cdi', 'CD-i'),
              ('1991_sega_cd', 'Sega CD'),
              ('1993_3do', '3DO Interactive Multiplayer'),
              ('1993_jaguar', 'Atari Jaguar'),
              ('1994_neogeo_cd', 'Neo Geo CD'),
              ('1994_32x', '32X'),
              ('1994_saturn', 'Sega Saturn'),
              ('1994_playstation', 'PlayStation (console)'),
              ('1994_pcfx', 'PC-FX'),
              ('1995_virtual_boy', 'Virtual Boy'),
              ('1996_n64', 'Nintendo 64'),
              ('1996_tamagotchi', 'Tamagotchi'),
              ('1998_game_boy_color', 'Game Boy Color'),
              ('1998_neogeo_pocket', 'Neo Geo Pocket'),
              ('1999_wonderswan', 'WonderSwan'),
              ('1990s_dos_pc', 'IBM PC compatible'),
            ],
          }

          out = Path('retro_hardware_assets')
          out.mkdir(exist_ok=True)
          manifest = []
          headers = {'User-Agent': 'EmuHubRetroAssetCollector/1.0 (educational preservation project)'}

          def api_json(url):
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=30) as r:
              return json.load(r)

          def download(url, dest):
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=60) as r, open(dest, 'wb') as f:
              f.write(r.read())

          for era, systems in SYSTEMS.items():
            era_dir = out / era
            era_dir.mkdir(exist_ok=True)
            for slug, title in systems:
              params = {
                'action': 'query', 'format': 'json', 'formatversion': '2',
                'redirects': '1', 'prop': 'pageimages',
                'piprop': 'original|thumbnail', 'pithumbsize': '1600',
                'titles': title,
              }
              api = 'https://en.wikipedia.org/w/api.php?' + urllib.parse.urlencode(params)
              item = {'era': era, 'slug': slug, 'title': title, 'source_api': api}
              try:
                data = api_json(api)
                page = (data.get('query', {}).get('pages') or [{}])[0]
                img = (page.get('original') or page.get('thumbnail') or {}).get('source')
                if not img:
                  item['status'] = 'no_image'
                  manifest.append(item)
                  print('NO IMAGE', title)
                  continue
                ext = Path(urllib.parse.urlparse(img).path).suffix.lower()
                if ext not in {'.png','.jpg','.jpeg','.webp','.svg'}:
                  ext = '.jpg'
                dest = era_dir / f'{slug}{ext}'
                download(img, dest)
                item.update({'status':'ok','file':str(dest),'image_url':img,'bytes':dest.stat().st_size})
                manifest.append(item)
                print('OK', title, '->', dest)
              except Exception as exc:
                item.update({'status':'error','error':repr(exc)})
                manifest.append(item)
                print('ERROR', title, exc)
              time.sleep(0.12)

          (out/'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          ok = sum(x.get('status') == 'ok' for x in manifest)
          print(f'Downloaded {ok}/{len(manifest)} hardware images')
          if ok < 35:
            raise SystemExit('Too few authentic hardware images downloaded')
          PY
      - name: Upload authentic hardware pack
        uses: actions/upload-artifact@v4
        with:
          name: emuhub-authentic-retro-hardware
          path: retro_hardware_assets
          if-no-files-found: error
          retention-days: 3
